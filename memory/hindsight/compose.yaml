services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    container_name: paseo-hindsight
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    env_file:
      - ${HINDSIGHT_ENV_FILE:-${HOME}/.local/share/paseo-hindsight/service.env}
    volumes:
      - memory-data:/home/hindsight/.pg0
      - model-cache:/home/hindsight/.cache

volumes:
  memory-data:
    name: paseo-hindsight-data
  model-cache:
    name: paseo-hindsight-model-cache
